<svg width="860" height="430" viewBox="0 0 860 430" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="860" height="430" fill="#030710" rx="8"/>
  <text x="430.0" y="32" text-anchor="middle" font-size="15" font-weight="300" fill="#F2FAFF">Lab overview: one agent, two kinds of storage</text>
  <text x="430.0" y="52" text-anchor="middle" font-size="11" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">What m2.2_agent.ts sets up before you open it</text>
  <rect x="24" y="65" width="420" height="309" rx="8" fill="#0D1322" stroke="#2F4B68" stroke-width="1.5"/>
  <rect x="24" y="65" width="420" height="26" rx="8" fill="#1E3A5F"/>
  <rect x="24" y="83" width="420" height="8" fill="#1E3A5F"/>
  <circle cx="40" cy="78" r="4" fill="#441E33"/>
  <circle cx="54" cy="78" r="4" fill="#634643"/>
  <circle cx="68" cy="78" r="4" fill="#2E3900"/>
  <text x="84" y="82" font-size="9" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m2.2_agent.ts</text>
  <rect x="28" y="164" width="412" height="17" rx="3" fill="#2E3900" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="28" y="202" width="412" height="55" rx="3" fill="#0D1F3A" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="28" y="278" width="412" height="55" rx="3" fill="#2A1A2E" stroke="#C78EAD" stroke-width="1.5"/>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="40.0" y="120" fill="#40668D">const agent = createDeepAgent({</text>
    <text x="53.8" y="139" fill="#40668D">model,</text>
    <text x="53.8" y="158" fill="#40668D">backend: new CompositeBackend(</text>
    <text x="67.6" y="177" fill="#E3FF8F">new StateBackend(),</text>
    <text x="67.6" y="196" fill="#40668D">{</text>
    <text x="81.4" y="215" fill="#7FC8FF">&quot;/reference/&quot;: new FilesystemBackend({</text>
    <text x="95.2" y="234" fill="#7FC8FF">rootDir: referenceDir,</text>
    <text x="95.2" y="253" fill="#7FC8FF">virtualMode: true }),</text>
    <text x="67.6" y="272" fill="#40668D">}),</text>
    <text x="53.8" y="291" fill="#C78EAD">permissions: [{</text>
    <text x="67.6" y="310" fill="#C78EAD">operations: [&quot;write&quot;],</text>
    <text x="67.6" y="329" fill="#C78EAD">paths: [&quot;/reference/**&quot;], mode: &quot;deny&quot; }],</text>
    <text x="40.0" y="348" fill="#40668D">});</text>
  </g>
  <line x1="440" y1="173.0" x2="468" y2="159.0" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="468" y="141.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#6E8900" stroke-width="1.5"/>
  <text x="479" y="160.0" font-size="13" fill="#E3FF8F">THE DEFAULT ROUTE</text>
  <text x="479" y="179.0" font-size="12" fill="#B2DEFF">Any path outside /reference/ lives in</text>
  <text x="479" y="196.0" font-size="12" fill="#B2DEFF">agent state, scoped to the thread</text>
  <line x1="440" y1="230.0" x2="468" y2="235.0" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="468" y="217.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#006DDD" stroke-width="1.5"/>
  <text x="479" y="236.0" font-size="13" fill="#7FC8FF">THE /reference/ ROUTE</text>
  <text x="479" y="255.0" font-size="12" fill="#B2DEFF">Paths under /reference/ map to real</text>
  <text x="479" y="272.0" font-size="12" fill="#B2DEFF">files on disk under referenceDir</text>
  <line x1="440" y1="306.0" x2="468" y2="311.0" stroke="#C78EAD" stroke-width="1.5"/>
  <rect x="468" y="293.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#C78EAD" stroke-width="1.5"/>
  <text x="479" y="312.0" font-size="13" fill="#C78EAD">THE PERMISSION RULE</text>
  <text x="479" y="331.0" font-size="12" fill="#B2DEFF">The agent can read /reference/ but not</text>
  <text x="479" y="348.0" font-size="12" fill="#B2DEFF">write to it, enforced in code</text>
  <text x="430.0" y="408" text-anchor="middle" font-size="10.5" fill="#CCE9FF">CompositeBackend picks a backend by path prefix, so the agent just sees one filesystem.</text>
</svg>
