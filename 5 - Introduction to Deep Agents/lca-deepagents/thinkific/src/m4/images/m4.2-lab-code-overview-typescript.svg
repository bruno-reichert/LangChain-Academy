<svg width="860" height="468" viewBox="0 0 860 468" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="860" height="468" fill="#030710" rx="8"/>
  <text x="430.0" y="32" text-anchor="middle" font-size="15" font-weight="300" fill="#F2FAFF">Lab overview: an editor and its researchers</text>
  <text x="430.0" y="52" text-anchor="middle" font-size="11" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">What m4_2_newsletter_agent.ts sets up before you open it</text>
  <rect x="24" y="65" width="420" height="347" rx="8" fill="#0D1322" stroke="#2F4B68" stroke-width="1.5"/>
  <rect x="24" y="65" width="420" height="26" rx="8" fill="#1E3A5F"/>
  <rect x="24" y="83" width="420" height="8" fill="#1E3A5F"/>
  <circle cx="40" cy="78" r="4" fill="#441E33"/>
  <circle cx="54" cy="78" r="4" fill="#634643"/>
  <circle cx="68" cy="78" r="4" fill="#2E3900"/>
  <text x="84" y="82" font-size="9" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m4_2_newsletter_agent.ts</text>
  <rect x="28" y="126" width="412" height="55" rx="3" fill="#2E3900" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="28" y="183" width="412" height="55" rx="3" fill="#0D1F3A" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="28" y="335" width="412" height="17" rx="3" fill="#2A1A2E" stroke="#C78EAD" stroke-width="1.5"/>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="40.0" y="120" fill="#40668D">const genreResearcher: SubAgent = {</text>
    <text x="53.8" y="139" fill="#E3FF8F">name: &quot;genre-researcher&quot;,</text>
    <text x="53.8" y="158" fill="#E3FF8F">description: &quot;Research one music genre...&quot;,</text>
    <text x="53.8" y="177" fill="#E3FF8F">systemPrompt: GENRE_PROMPT,</text>
    <text x="53.8" y="196" fill="#7FC8FF">tools: [internetSearch],</text>
    <text x="53.8" y="215" fill="#7FC8FF">model, // cheaper Haiku</text>
    <text x="53.8" y="234" fill="#7FC8FF">permissions: researchPermissions,</text>
    <text x="40.0" y="253" fill="#40668D">};</text>
    <text x="40.0" y="272" fill="#40668D"></text>
    <text x="40.0" y="291" fill="#40668D">export const agent = createDeepAgent({</text>
    <text x="53.8" y="310" fill="#40668D">model: strongModel,</text>
    <text x="53.8" y="329" fill="#40668D">tools: [markdownToHtml],</text>
    <text x="53.8" y="348" fill="#C78EAD">subagents: [genreResearcher],</text>
    <text x="53.8" y="367" fill="#40668D">permissions: editorPermissions,</text>
    <text x="40.0" y="386" fill="#40668D">});</text>
  </g>
  <line x1="440" y1="154.0" x2="468" y2="140.0" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="468" y="122.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#6E8900" stroke-width="1.5"/>
  <text x="479" y="141.0" font-size="13" fill="#E3FF8F">THE JOB DESCRIPTION</text>
  <text x="479" y="160.0" font-size="12" fill="#B2DEFF">The editor picks this subagent by its</text>
  <text x="479" y="177.0" font-size="12" fill="#B2DEFF">description; it gets its own prompt</text>
  <line x1="440" y1="211.0" x2="468" y2="216.0" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="468" y="198.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#006DDD" stroke-width="1.5"/>
  <text x="479" y="217.0" font-size="13" fill="#7FC8FF">ITS OWN SETUP</text>
  <text x="479" y="236.0" font-size="12" fill="#B2DEFF">Its own tools, a cheaper model, and write</text>
  <text x="479" y="253.0" font-size="12" fill="#B2DEFF">access limited to /research/</text>
  <line x1="440" y1="344.0" x2="468" y2="330.0" stroke="#C78EAD" stroke-width="1.5"/>
  <rect x="468" y="312.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#C78EAD" stroke-width="1.5"/>
  <text x="479" y="331.0" font-size="13" fill="#C78EAD">THE DELEGATION</text>
  <text x="479" y="350.0" font-size="12" fill="#B2DEFF">One task call per genre, run in parallel;</text>
  <text x="479" y="367.0" font-size="12" fill="#B2DEFF">only the finished segments come back</text>
  <text x="430.0" y="446" text-anchor="middle" font-size="10.5" fill="#CCE9FF">The editor can&#x27;t write to /research/; each researcher can write only there.</text>
</svg>
