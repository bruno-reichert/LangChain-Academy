<svg width="860" height="449" viewBox="0 0 860 449" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="860" height="449" fill="#030710" rx="8"/>
  <text x="430.0" y="32" text-anchor="middle" font-size="15" font-weight="300" fill="#F2FAFF">Lab overview: memory that outlives the thread</text>
  <text x="430.0" y="52" text-anchor="middle" font-size="11" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">What m3.3_memory_agent.ts sets up before you open it</text>
  <rect x="24" y="65" width="420" height="328" rx="8" fill="#0D1322" stroke="#2F4B68" stroke-width="1.5"/>
  <rect x="24" y="65" width="420" height="26" rx="8" fill="#1E3A5F"/>
  <rect x="24" y="83" width="420" height="8" fill="#1E3A5F"/>
  <circle cx="40" cy="78" r="4" fill="#441E33"/>
  <circle cx="54" cy="78" r="4" fill="#634643"/>
  <circle cx="68" cy="78" r="4" fill="#2E3900"/>
  <text x="84" y="82" font-size="9" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m3.3_memory_agent.ts</text>
  <rect x="28" y="107" width="412" height="55" rx="3" fill="#2A1A2E" stroke="#C78EAD" stroke-width="1.5"/>
  <rect x="28" y="259" width="412" height="36" rx="3" fill="#0D1F3A" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="28" y="335" width="412" height="17" rx="3" fill="#2E3900" stroke="#6E8900" stroke-width="1.5"/>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="40.0" y="120" fill="#C78EAD">function memoryNamespace(ctx: StoreBackendContext) {</text>
    <text x="53.8" y="139" fill="#C78EAD">const cfg = ctx.config.configurable;</text>
    <text x="53.8" y="158" fill="#C78EAD">return [&quot;memory&quot;, cfg.workspace_id, cfg.user_id];</text>
    <text x="40.0" y="177" fill="#40668D">}</text>
    <text x="40.0" y="196" fill="#40668D">const agent = createDeepAgent({</text>
    <text x="53.8" y="215" fill="#40668D">model,</text>
    <text x="53.8" y="234" fill="#40668D">backend: new CompositeBackend(</text>
    <text x="67.6" y="253" fill="#40668D">new StateBackend(), {</text>
    <text x="67.6" y="272" fill="#7FC8FF">&quot;/memories/&quot;: new StoreBackend({</text>
    <text x="81.4" y="291" fill="#7FC8FF">namespace: memoryNamespace }),</text>
    <text x="53.8" y="310" fill="#40668D">}),</text>
    <text x="53.8" y="329" fill="#40668D">store,</text>
    <text x="53.8" y="348" fill="#E3FF8F">memory: [&quot;/memories/AGENTS.md&quot;],</text>
    <text x="40.0" y="367" fill="#40668D">});</text>
  </g>
  <line x1="440" y1="135.0" x2="468" y2="121.0" stroke="#C78EAD" stroke-width="1.5"/>
  <rect x="468" y="103.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#C78EAD" stroke-width="1.5"/>
  <text x="479" y="122.0" font-size="13" fill="#C78EAD">WHO IT BELONGS TO</text>
  <text x="479" y="141.0" font-size="12" fill="#B2DEFF">The namespace is built from the user&#x27;s</text>
  <text x="479" y="158.0" font-size="12" fill="#B2DEFF">context, so each user has their own file</text>
  <line x1="440" y1="277.5" x2="468" y2="263.5" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="468" y="245.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#006DDD" stroke-width="1.5"/>
  <text x="479" y="264.5" font-size="13" fill="#7FC8FF">WHERE MEMORY LIVES</text>
  <text x="479" y="283.5" font-size="12" fill="#B2DEFF">/memories/ is routed to the LangGraph</text>
  <text x="479" y="300.5" font-size="12" fill="#B2DEFF">store, so it persists across threads</text>
  <line x1="440" y1="344.0" x2="468" y2="339.5" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="468" y="321.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#6E8900" stroke-width="1.5"/>
  <text x="479" y="340.5" font-size="13" fill="#E3FF8F">WHAT GETS LOADED</text>
  <text x="479" y="359.5" font-size="12" fill="#B2DEFF">AGENTS.md is loaded when a thread starts</text>
  <text x="479" y="376.5" font-size="12" fill="#B2DEFF">and injected into the system prompt</text>
  <text x="430.0" y="427" text-anchor="middle" font-size="10.5" fill="#CCE9FF">A memory edit shows up in the next thread, not in later turns of the same one.</text>
</svg>
