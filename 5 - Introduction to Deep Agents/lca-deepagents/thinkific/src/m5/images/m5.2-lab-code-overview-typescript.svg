<svg width="860" height="413" viewBox="0 0 860 413" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="860" height="413" fill="#030710" rx="8"/>
  <text x="430.0" y="32" text-anchor="middle" font-size="15" font-weight="300" fill="#F2FAFF">Lab overview: from a script to a local server</text>
  <text x="430.0" y="52" text-anchor="middle" font-size="11" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">What typescript/m5/hello sets up before you open it</text>
  <rect x="24" y="65" width="420" height="290" rx="8" fill="#0D1322" stroke="#2F4B68" stroke-width="1.5"/>
  <rect x="24" y="65" width="420" height="26" rx="8" fill="#1E3A5F"/>
  <rect x="24" y="83" width="420" height="8" fill="#1E3A5F"/>
  <circle cx="40" cy="78" r="4" fill="#441E33"/>
  <circle cx="54" cy="78" r="4" fill="#634643"/>
  <circle cx="68" cy="78" r="4" fill="#2E3900"/>
  <text x="84" y="82" font-size="9" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m5/hello/</text>
  <rect x="28" y="126" width="412" height="17" rx="3" fill="#2E3900" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="28" y="202" width="412" height="55" rx="3" fill="#0D1F3A" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="28" y="316" width="412" height="17" rx="3" fill="#2A1A2E" stroke="#C78EAD" stroke-width="1.5"/>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="40.0" y="120" fill="#40668D">// agent.ts</text>
    <text x="40.0" y="139" fill="#E3FF8F">export const graph = createDeepAgent({ model });</text>
    <text x="40.0" y="158" fill="#40668D"></text>
    <text x="40.0" y="177" fill="#40668D">// langgraph.json</text>
    <text x="40.0" y="196" fill="#40668D">{</text>
    <text x="53.8" y="215" fill="#7FC8FF">&quot;graphs&quot;: {</text>
    <text x="67.6" y="234" fill="#7FC8FF">&quot;agent&quot;: &quot;./agent.ts:graph&quot;</text>
    <text x="53.8" y="253" fill="#7FC8FF">},</text>
    <text x="53.8" y="272" fill="#40668D">&quot;env&quot;: &quot;../../.env&quot;</text>
    <text x="40.0" y="291" fill="#40668D">}</text>
    <text x="40.0" y="310" fill="#40668D"></text>
    <text x="40.0" y="329" fill="#C78EAD">$ pnpm exec langgraphjs dev</text>
  </g>
  <line x1="440" y1="135.0" x2="468" y2="121.0" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="468" y="103.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#6E8900" stroke-width="1.5"/>
  <text x="479" y="122.0" font-size="13" fill="#E3FF8F">THE GRAPH</text>
  <text x="479" y="141.0" font-size="12" fill="#B2DEFF">A module-level variable the</text>
  <text x="479" y="158.0" font-size="12" fill="#B2DEFF">server can import</text>
  <line x1="440" y1="230.0" x2="468" y2="216.0" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="468" y="198.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#006DDD" stroke-width="1.5"/>
  <text x="479" y="217.0" font-size="13" fill="#7FC8FF">THE GRAPH REGISTRY</text>
  <text x="479" y="236.0" font-size="12" fill="#B2DEFF">&quot;agent&quot; is the graph ID; it points at</text>
  <text x="479" y="253.0" font-size="12" fill="#B2DEFF">the file and the variable to serve</text>
  <line x1="440" y1="325.0" x2="468" y2="311.0" stroke="#C78EAD" stroke-width="1.5"/>
  <rect x="468" y="293.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#C78EAD" stroke-width="1.5"/>
  <text x="479" y="312.0" font-size="13" fill="#C78EAD">THE SERVER</text>
  <text x="479" y="331.0" font-size="12" fill="#B2DEFF">Serves the agent&#x27;s API on :2024</text>
  <text x="479" y="348.0" font-size="12" fill="#B2DEFF">and opens it in Studio</text>
  <text x="430.0" y="391" text-anchor="middle" font-size="10.5" fill="#CCE9FF">Studio and any other client talk to the agent over HTTP, by its graph ID.</text>
</svg>
