<svg width="860" height="413" viewBox="0 0 860 413" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="860" height="413" fill="#030710" rx="8"/>
  <text x="430.0" y="32" text-anchor="middle" font-size="15" font-weight="300" fill="#F2FAFF">Lab overview: a subagent on its own deployment</text>
  <text x="430.0" y="52" text-anchor="middle" font-size="11" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">What main_agent/agent.ts sets up before you open it</text>
  <rect x="24" y="65" width="420" height="290" rx="8" fill="#0D1322" stroke="#2F4B68" stroke-width="1.5"/>
  <rect x="24" y="65" width="420" height="26" rx="8" fill="#1E3A5F"/>
  <rect x="24" y="83" width="420" height="8" fill="#1E3A5F"/>
  <circle cx="40" cy="78" r="4" fill="#441E33"/>
  <circle cx="54" cy="78" r="4" fill="#634643"/>
  <circle cx="68" cy="78" r="4" fill="#2E3900"/>
  <text x="84" y="82" font-size="9" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">main_agent/agent.ts</text>
  <rect x="28" y="145" width="412" height="55" rx="3" fill="#2E3900" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="28" y="202" width="412" height="36" rx="3" fill="#0D1F3A" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="28" y="297" width="412" height="36" rx="3" fill="#2A1A2E" stroke="#C78EAD" stroke-width="1.5"/>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="40.0" y="120" fill="#40668D">const subagents: AsyncSubAgent[] = [</text>
    <text x="53.8" y="139" fill="#40668D">{</text>
    <text x="67.6" y="158" fill="#E3FF8F">name: &quot;analyst&quot;,</text>
    <text x="67.6" y="177" fill="#E3FF8F">description: &quot;Runs sales analysis by region&quot; +</text>
    <text x="81.4" y="196" fill="#E3FF8F">&quot; or by product...&quot;,</text>
    <text x="67.6" y="215" fill="#7FC8FF">graphId: &quot;agent&quot;,</text>
    <text x="67.6" y="234" fill="#7FC8FF">url: &quot;http://localhost:2025&quot;,</text>
    <text x="53.8" y="253" fill="#40668D">},</text>
    <text x="40.0" y="272" fill="#40668D">];</text>
    <text x="40.0" y="291" fill="#40668D"></text>
    <text x="40.0" y="310" fill="#C78EAD">export const graph = createDeepAgent({</text>
    <text x="53.8" y="329" fill="#C78EAD">model, subagents });</text>
  </g>
  <line x1="440" y1="173.0" x2="468" y2="159.0" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="468" y="141.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#6E8900" stroke-width="1.5"/>
  <text x="479" y="160.0" font-size="13" fill="#E3FF8F">WHO TO CALL</text>
  <text x="479" y="179.0" font-size="12" fill="#B2DEFF">Picked by name and description,</text>
  <text x="479" y="196.0" font-size="12" fill="#B2DEFF">just like a regular subagent</text>
  <line x1="440" y1="220.5" x2="468" y2="235.0" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="468" y="217.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#006DDD" stroke-width="1.5"/>
  <text x="479" y="236.0" font-size="13" fill="#7FC8FF">WHERE IT RUNS</text>
  <text x="479" y="255.0" font-size="12" fill="#B2DEFF">A second langgraphjs dev server on :2025,</text>
  <text x="479" y="272.0" font-size="12" fill="#B2DEFF">so its slow job can&#x27;t block the main agent</text>
  <line x1="440" y1="315.5" x2="468" y2="311.0" stroke="#C78EAD" stroke-width="1.5"/>
  <rect x="468" y="293.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#C78EAD" stroke-width="1.5"/>
  <text x="479" y="312.0" font-size="13" fill="#C78EAD">WHAT THE MAIN AGENT GETS</text>
  <text x="479" y="331.0" font-size="12" fill="#B2DEFF">Async task tools; start_async_task returns</text>
  <text x="479" y="348.0" font-size="12" fill="#B2DEFF">a task_id right away instead of waiting</text>
  <text x="430.0" y="391" text-anchor="middle" font-size="10.5" fill="#CCE9FF">You run two servers: start specialized_agent first, then main_agent.</text>
</svg>
