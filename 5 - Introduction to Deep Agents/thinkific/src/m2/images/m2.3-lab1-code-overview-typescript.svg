<svg width="860" height="411" viewBox="0 0 860 411" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="860" height="411" fill="#030710" rx="8"/>
  <text x="430.0" y="32" text-anchor="middle" font-size="15" font-weight="300" fill="#F2FAFF">Lab overview: an agent that runs code in a sandbox</text>
  <text x="430.0" y="52" text-anchor="middle" font-size="11" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">What m2.3_sandbox_agent.ts sets up before you open it</text>
  <rect x="24" y="65" width="420" height="290" rx="8" fill="#0D1322" stroke="#2F4B68" stroke-width="1.5"/>
  <rect x="24" y="65" width="420" height="26" rx="8" fill="#1E3A5F"/>
  <rect x="24" y="83" width="420" height="8" fill="#1E3A5F"/>
  <circle cx="40" cy="78" r="4" fill="#441E33"/>
  <circle cx="54" cy="78" r="4" fill="#634643"/>
  <circle cx="68" cy="78" r="4" fill="#2E3900"/>
  <text x="84" y="82" font-size="9" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m2.3_sandbox_agent.ts</text>
  <rect x="28" y="107" width="412" height="36" rx="3" fill="#2E3900" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="28" y="164" width="412" height="74" rx="3" fill="#0D1F3A" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="28" y="297" width="412" height="36" rx="3" fill="#2A1A2E" stroke="#C78EAD" stroke-width="1.5"/>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="40.0" y="120" fill="#E3FF8F">const client = new SandboxClient();</text>
    <text x="40.0" y="139" fill="#E3FF8F">const ls_sandbox = await client.createSandbox({ ... });</text>
    <text x="40.0" y="158" fill="#40668D"></text>
    <text x="40.0" y="177" fill="#7FC8FF">const agent = createDeepAgent({</text>
    <text x="53.8" y="196" fill="#7FC8FF">model,</text>
    <text x="53.8" y="215" fill="#7FC8FF">backend: new LangSmithSandbox({ sandbox: ls_sandbox }),</text>
    <text x="53.8" y="234" fill="#7FC8FF">systemPrompt: &quot;...write the script, then execute it.&quot;,</text>
    <text x="40.0" y="253" fill="#8CA0BC">});</text>
    <text x="40.0" y="272" fill="#40668D">try {</text>
    <text x="53.8" y="291" fill="#40668D">await agent.invoke({ ...&quot;save to fib.py, run it&quot; });</text>
    <text x="40.0" y="310" fill="#C78EAD">} finally {</text>
    <text x="53.8" y="329" fill="#C78EAD">await client.deleteSandbox(ls_sandbox.name);</text>
  </g>
  <line x1="440" y1="125.5" x2="468" y2="111.5" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="468" y="93.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#6E8900" stroke-width="1.5"/>
  <text x="479" y="112.5" font-size="13" fill="#E3FF8F">THE SANDBOX</text>
  <text x="479" y="131.5" font-size="12" fill="#B2DEFF">A fresh LangSmith sandbox,</text>
  <text x="479" y="148.5" font-size="12" fill="#B2DEFF">created just for this run</text>
  <line x1="440" y1="201.5" x2="468" y2="187.5" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="468" y="169.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#006DDD" stroke-width="1.5"/>
  <text x="479" y="188.5" font-size="13" fill="#7FC8FF">THE BACKEND</text>
  <text x="479" y="207.5" font-size="12" fill="#B2DEFF">The agent&#x27;s file tools and execute</text>
  <text x="479" y="224.5" font-size="12" fill="#B2DEFF">both run inside the sandbox</text>
  <line x1="440" y1="315.5" x2="468" y2="301.5" stroke="#C78EAD" stroke-width="1.5"/>
  <rect x="468" y="283.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#C78EAD" stroke-width="1.5"/>
  <text x="479" y="302.5" font-size="13" fill="#C78EAD">THE CLEANUP</text>
  <text x="479" y="321.5" font-size="12" fill="#B2DEFF">Delete the sandbox when the run ends,</text>
  <text x="479" y="338.5" font-size="12" fill="#B2DEFF">even if it fails</text>
  <text x="430.0" y="389" text-anchor="middle" font-size="10.5" fill="#CCE9FF">A sandbox backend also gives the agent the execute tool for running shell commands.</text>
</svg>
