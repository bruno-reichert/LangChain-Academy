<svg width="860" height="449" viewBox="0 0 860 449" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="860" height="449" fill="#030710" rx="8"/>
  <text x="430.0" y="32" text-anchor="middle" font-size="15" font-weight="300" fill="#F2FAFF">Lab overview: the same tool, with and without the interpreter</text>
  <text x="430.0" y="52" text-anchor="middle" font-size="11" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">What m2.4_interpreter_agent.ts sets up before you open it</text>
  <rect x="24" y="65" width="420" height="328" rx="8" fill="#0D1322" stroke="#2F4B68" stroke-width="1.5"/>
  <rect x="24" y="65" width="420" height="26" rx="8" fill="#1E3A5F"/>
  <rect x="24" y="83" width="420" height="8" fill="#1E3A5F"/>
  <circle cx="40" cy="78" r="4" fill="#441E33"/>
  <circle cx="54" cy="78" r="4" fill="#634643"/>
  <circle cx="68" cy="78" r="4" fill="#2E3900"/>
  <text x="84" y="82" font-size="9" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m2.4_interpreter_agent.ts</text>
  <rect x="28" y="107" width="412" height="36" rx="3" fill="#2E3900" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="28" y="221" width="412" height="36" rx="3" fill="#0D1F3A" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="28" y="297" width="412" height="74" rx="3" fill="#2A1A2E" stroke="#C78EAD" stroke-width="1.5"/>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="40.0" y="120" fill="#E3FF8F">const queryChinook = tool(({ sql }) =&gt; ...,</text>
    <text x="53.8" y="139" fill="#E3FF8F">{ name: &quot;query_chinook&quot;, ... });</text>
    <text x="40.0" y="158" fill="#40668D"></text>
    <text x="40.0" y="177" fill="#40668D">const agentWith = createDeepAgent({</text>
    <text x="53.8" y="196" fill="#40668D">model,</text>
    <text x="53.8" y="215" fill="#40668D">tools: [queryChinook],</text>
    <text x="53.8" y="234" fill="#7FC8FF">middleware: [createCodeInterpreterMiddleware({</text>
    <text x="67.6" y="253" fill="#7FC8FF">ptc: [&quot;query_chinook&quot;] })],</text>
    <text x="40.0" y="272" fill="#40668D">});</text>
    <text x="40.0" y="291" fill="#40668D"></text>
    <text x="40.0" y="310" fill="#C78EAD">const agentWithout = createDeepAgent({</text>
    <text x="53.8" y="329" fill="#C78EAD">model,</text>
    <text x="53.8" y="348" fill="#C78EAD">tools: [queryChinook],</text>
    <text x="40.0" y="367" fill="#C78EAD">});</text>
  </g>
  <line x1="440" y1="125.5" x2="468" y2="111.5" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="468" y="93.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#6E8900" stroke-width="1.5"/>
  <text x="479" y="112.5" font-size="13" fill="#E3FF8F">THE TOOL</text>
  <text x="479" y="131.5" font-size="12" fill="#B2DEFF">An ordinary SQL tool, given to</text>
  <text x="479" y="148.5" font-size="12" fill="#B2DEFF">both agents</text>
  <line x1="440" y1="239.5" x2="468" y2="225.5" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="468" y="207.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#006DDD" stroke-width="1.5"/>
  <text x="479" y="226.5" font-size="13" fill="#7FC8FF">THE PTC ALLOWLIST</text>
  <text x="479" y="245.5" font-size="12" fill="#B2DEFF">JavaScript in eval can call it</text>
  <text x="479" y="262.5" font-size="12" fill="#B2DEFF">as tools.queryChinook()</text>
  <line x1="440" y1="334.5" x2="468" y2="320.5" stroke="#C78EAD" stroke-width="1.5"/>
  <rect x="468" y="302.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#C78EAD" stroke-width="1.5"/>
  <text x="479" y="321.5" font-size="13" fill="#C78EAD">THE COMPARISON</text>
  <text x="479" y="340.5" font-size="12" fill="#B2DEFF">Same tool, no interpreter: each dependent</text>
  <text x="479" y="357.5" font-size="12" fill="#B2DEFF">query needs its own model turn</text>
  <text x="430.0" y="427" text-anchor="middle" font-size="10.5" fill="#CCE9FF">With PTC, chained queries can run in one eval call, so in-between results never go back to the model.</text>
</svg>
