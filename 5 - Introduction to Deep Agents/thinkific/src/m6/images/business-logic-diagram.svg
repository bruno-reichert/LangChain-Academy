    <rect x="8" y="8" width="204" height="194" rx="6" fill="#0D1322" stroke="#40668D" stroke-width="1.5"/>
    <text x="20" y="40" font-size="15" font-weight="700" fill="#F2FAFF">You provide</text>

    <!-- Business logic box -->
    <rect x="20" y="58" width="180" height="128" rx="4" fill="#132318" stroke="#E3FF8F" stroke-width="1.5"/>
