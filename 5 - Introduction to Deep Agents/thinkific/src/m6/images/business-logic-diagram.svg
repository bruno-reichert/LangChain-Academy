<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2400" viewBox="0 0 3840 2400" font-family="'TWK Lausanne', 'Inter', sans-serif">
  <defs>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#40668D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="3840" height="2400" fill="#030710"/>

  <g transform="translate(87.85,126.42) scale(6.4286)">
