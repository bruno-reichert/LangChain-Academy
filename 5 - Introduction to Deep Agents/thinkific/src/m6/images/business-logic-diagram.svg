    <text x="283" y="251" font-size="13" font-weight="500" fill="#FDF3FF">- Agent Server</text>
    <text x="283" y="269" font-size="13" font-weight="500" fill="#FDF3FF">- Sandboxes</text>
    <text x="283" y="287" font-size="13" font-weight="500" fill="#FDF3FF">- Schedules</text>

    <!-- Arrows -->
    <path d="M202,113 L267,113" fill="none" stroke="#40668D" stroke-width="2.5" marker-end="url(#grayArrow)"/>
    <path d="M386,170 L386,198" fill="none" stroke="#40668D" stroke-width="2.5" marker-end="url(#grayArrow)"/>
