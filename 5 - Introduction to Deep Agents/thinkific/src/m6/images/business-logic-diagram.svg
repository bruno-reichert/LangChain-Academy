    <rect x="244" y="8" width="275" height="318" rx="6" fill="#0D1322" stroke="#40668D" stroke-width="1.5"/>
    <text x="256" y="40" font-size="15" font-weight="700" fill="#F2FAFF">Managed Deep Agents</text>

