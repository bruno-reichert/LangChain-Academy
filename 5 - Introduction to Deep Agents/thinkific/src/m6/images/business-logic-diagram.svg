    <text x="32" y="109" font-size="13" font-weight="500" fill="#F6FFDB">- Instructions</text>
    <text x="32" y="127" font-size="13" font-weight="500" fill="#F6FFDB">- Tools</text>
    <text x="32" y="145" font-size="13" font-weight="500" fill="#F6FFDB">- Skills</text>
    <text x="32" y="163" font-size="13" font-weight="500" fill="#F6FFDB">- Model</text>

