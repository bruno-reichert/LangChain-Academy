<svg width="860" height="411" viewBox="0 0 860 411" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="860" height="411" fill="#030710" rx="8"/>
  <text x="430.0" y="32" text-anchor="middle" font-size="15" font-weight="300" fill="#F2FAFF">Lab overview: same thread vs new thread</text>
  <text x="430.0" y="52" text-anchor="middle" font-size="11" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">What m1.7_messages_threads_checkpointers.py sets up</text>
  <rect x="24" y="65" width="420" height="290" rx="8" fill="#0D1322" stroke="#2F4B68" stroke-width="1.5"/>
  <rect x="24" y="65" width="420" height="26" rx="8" fill="#1E3A5F"/>
  <rect x="24" y="83" width="420" height="8" fill="#1E3A5F"/>
  <circle cx="40" cy="78" r="4" fill="#441E33"/>
  <circle cx="54" cy="78" r="4" fill="#634643"/>
  <circle cx="68" cy="78" r="4" fill="#2E3900"/>
  <text x="84" y="82" font-size="9" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m1.7_messages_threads_checkpointers.py</text>
  <rect x="28" y="145" width="412" height="17" rx="3" fill="#2E3900" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="28" y="202" width="412" height="36" rx="3" fill="#0D1F3A" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="28" y="259" width="412" height="74" rx="3" fill="#2A1A2E" stroke="#C78EAD" stroke-width="1.5"/>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="40.0" y="120" fill="#40668D">agent = create_deep_agent(</text>
    <text x="67.6" y="139" fill="#40668D">model=model,</text>
    <text x="67.6" y="158" fill="#E3FF8F">checkpointer=MemorySaver(),</text>
    <text x="40.0" y="177" fill="#40668D">)</text>
    <text x="40.0" y="196" fill="#40668D"></text>
    <text x="40.0" y="215" fill="#7FC8FF">thread_a = {&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;...thread-a&quot;}}</text>
    <text x="40.0" y="234" fill="#7FC8FF">thread_b = {&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;...thread-b&quot;}}</text>
    <text x="40.0" y="253" fill="#40668D">agent.invoke({...&quot;colour is blue&quot;}, config=thread_a)</text>
    <text x="40.0" y="272" fill="#C78EAD">agent.invoke({...&quot;favorite colour?&quot;}, config=thread_a)</text>
    <text x="40.0" y="291" fill="#C78EAD">#   remembers: blue</text>
    <text x="40.0" y="310" fill="#C78EAD">agent.invoke({...&quot;favorite colour?&quot;}, config=thread_b)</text>
    <text x="40.0" y="329" fill="#C78EAD">#   no history, so it doesn&#x27;t know</text>
  </g>
  <line x1="440" y1="154.0" x2="468" y2="140.0" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="468" y="122.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#6E8900" stroke-width="1.5"/>
  <text x="479" y="141.0" font-size="13" fill="#E3FF8F">THE CHECKPOINTER</text>
  <text x="479" y="160.0" font-size="12" fill="#B2DEFF">Saves each thread&#x27;s conversation</text>
  <text x="479" y="177.0" font-size="12" fill="#B2DEFF">as it runs (in memory here)</text>
  <line x1="440" y1="220.5" x2="468" y2="216.0" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="468" y="198.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#006DDD" stroke-width="1.5"/>
  <text x="479" y="217.0" font-size="13" fill="#7FC8FF">TWO THREAD IDS</text>
  <text x="479" y="236.0" font-size="12" fill="#B2DEFF">Each thread_id is its own conversation</text>
  <text x="479" y="253.0" font-size="12" fill="#B2DEFF">with its own saved history</text>
  <line x1="440" y1="296.5" x2="468" y2="292.0" stroke="#C78EAD" stroke-width="1.5"/>
  <rect x="468" y="274.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#C78EAD" stroke-width="1.5"/>
  <text x="479" y="293.0" font-size="13" fill="#C78EAD">SAME QUESTION, TWO THREADS</text>
  <text x="479" y="312.0" font-size="12" fill="#B2DEFF">Asked on thread A, it knows the answer;</text>
  <text x="479" y="329.0" font-size="12" fill="#B2DEFF">asked on thread B, it has no history</text>
  <text x="430.0" y="389" text-anchor="middle" font-size="10.5" fill="#CCE9FF">Thread A remembers the colour; thread B starts with an empty conversation.</text>
</svg>
