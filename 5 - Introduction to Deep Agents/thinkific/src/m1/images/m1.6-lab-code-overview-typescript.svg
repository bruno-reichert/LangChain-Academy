<svg width="860" height="411" viewBox="0 0 860 411" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="860" height="411" fill="#030710" rx="8"/>
  <text x="430.0" y="32" text-anchor="middle" font-size="15" font-weight="300" fill="#F2FAFF">Lab overview: tools from a remote MCP server</text>
  <text x="430.0" y="52" text-anchor="middle" font-size="11" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">What m1.6_agent_mcp.ts sets up before you open it</text>
  <rect x="24" y="65" width="420" height="290" rx="8" fill="#0D1322" stroke="#2F4B68" stroke-width="1.5"/>
  <rect x="24" y="65" width="420" height="26" rx="8" fill="#1E3A5F"/>
  <rect x="24" y="83" width="420" height="8" fill="#1E3A5F"/>
  <circle cx="40" cy="78" r="4" fill="#441E33"/>
  <circle cx="54" cy="78" r="4" fill="#634643"/>
  <circle cx="68" cy="78" r="4" fill="#2E3900"/>
  <text x="84" y="82" font-size="9" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m1.6_agent_mcp.ts</text>
  <rect x="28" y="107" width="412" height="112" rx="3" fill="#2E3900" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="28" y="221" width="412" height="17" rx="3" fill="#0D1F3A" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="28" y="259" width="412" height="36" rx="3" fill="#2A1A2E" stroke="#C78EAD" stroke-width="1.5"/>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="40.0" y="120" fill="#E3FF8F">const client = new MultiServerMCPClient({</text>
    <text x="53.8" y="139" fill="#E3FF8F">&quot;docs-langchain&quot;: {</text>
    <text x="67.6" y="158" fill="#E3FF8F">transport: &quot;http&quot;,</text>
    <text x="67.6" y="177" fill="#E3FF8F">url: &quot;https://docs.langchain.com/mcp&quot;,</text>
    <text x="53.8" y="196" fill="#E3FF8F">},</text>
    <text x="40.0" y="215" fill="#E3FF8F">});</text>
    <text x="40.0" y="234" fill="#7FC8FF">let tools = await client.getTools();</text>
    <text x="40.0" y="253" fill="#40668D"></text>
    <text x="40.0" y="272" fill="#C78EAD">const ALLOWED = new Set([&quot;search_docs_by_lang_chain&quot;]);</text>
    <text x="40.0" y="291" fill="#C78EAD">tools = tools.filter((t) =&gt; ALLOWED.has(t.name));</text>
    <text x="40.0" y="310" fill="#40668D"></text>
    <text x="40.0" y="329" fill="#40668D">const agent = createDeepAgent({ model, tools });</text>
  </g>
  <line x1="440" y1="163.5" x2="468" y2="149.5" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="468" y="131.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#6E8900" stroke-width="1.5"/>
  <text x="479" y="150.5" font-size="13" fill="#E3FF8F">THE SERVER CONFIG</text>
  <text x="479" y="169.5" font-size="12" fill="#B2DEFF">A name for the server, the transport,</text>
  <text x="479" y="186.5" font-size="12" fill="#B2DEFF">and the URL of the remote MCP server</text>
  <line x1="440" y1="230.0" x2="468" y2="225.5" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="468" y="207.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#006DDD" stroke-width="1.5"/>
  <text x="479" y="226.5" font-size="13" fill="#7FC8FF">THE TOOLS</text>
  <text x="479" y="245.5" font-size="12" fill="#B2DEFF">Every tool the server offers, turned</text>
  <text x="479" y="262.5" font-size="12" fill="#B2DEFF">into a regular LangChain tool</text>
  <line x1="440" y1="277.5" x2="468" y2="301.5" stroke="#C78EAD" stroke-width="1.5"/>
  <rect x="468" y="283.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#C78EAD" stroke-width="1.5"/>
  <text x="479" y="302.5" font-size="13" fill="#C78EAD">THE ALLOWLIST</text>
  <text x="479" y="321.5" font-size="12" fill="#B2DEFF">Keep only the tools this agent needs,</text>
  <text x="479" y="338.5" font-size="12" fill="#B2DEFF">then pass them in like any other tool</text>
  <text x="430.0" y="389" text-anchor="middle" font-size="10.5" fill="#CCE9FF">Filtering keeps the agent&#x27;s prompt small: only the tools it needs, only their descriptions.</text>
</svg>
