<svg width="860" height="468" viewBox="0 0 860 468" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="860" height="468" fill="#030710" rx="8"/>
  <text x="430.0" y="32" text-anchor="middle" font-size="15" font-weight="300" fill="#F2FAFF">Lab overview: pause, review, resume</text>
  <text x="430.0" y="52" text-anchor="middle" font-size="11" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">What m1.8_hitl.py sets up before you open it</text>
  <rect x="24" y="65" width="420" height="347" rx="8" fill="#0D1322" stroke="#2F4B68" stroke-width="1.5"/>
  <rect x="24" y="65" width="420" height="26" rx="8" fill="#1E3A5F"/>
  <rect x="24" y="83" width="420" height="8" fill="#1E3A5F"/>
  <circle cx="40" cy="78" r="4" fill="#441E33"/>
  <circle cx="54" cy="78" r="4" fill="#634643"/>
  <circle cx="68" cy="78" r="4" fill="#2E3900"/>
  <text x="84" y="82" font-size="9" fill="#99D3FF" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">m1.8_hitl.py</text>
  <rect x="28" y="164" width="412" height="17" rx="3" fill="#2E3900" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="28" y="183" width="412" height="17" rx="3" fill="#0D1F3A" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="28" y="316" width="412" height="74" rx="3" fill="#2A1A2E" stroke="#C78EAD" stroke-width="1.5"/>
  <g font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
    <text x="40.0" y="120" fill="#40668D">agent = create_deep_agent(</text>
    <text x="67.6" y="139" fill="#40668D">model=model,</text>
    <text x="67.6" y="158" fill="#40668D">tools=[send_email],</text>
    <text x="67.6" y="177" fill="#E3FF8F">interrupt_on={&quot;send_email&quot;: True},</text>
    <text x="67.6" y="196" fill="#7FC8FF">checkpointer=MemorySaver(),</text>
    <text x="40.0" y="215" fill="#40668D">)</text>
    <text x="40.0" y="234" fill="#40668D"></text>
    <text x="40.0" y="253" fill="#40668D">config = {</text>
    <text x="67.6" y="272" fill="#40668D">&quot;configurable&quot;: {&quot;thread_id&quot;: &quot;m1-8-hitl-demo&quot;}}</text>
    <text x="40.0" y="291" fill="#40668D">result = agent.invoke({...}, config=config, version=&quot;v2&quot;)</text>
    <text x="40.0" y="310" fill="#40668D"></text>
    <text x="40.0" y="329" fill="#C78EAD">while result.interrupts:</text>
    <text x="67.6" y="348" fill="#C78EAD">decisions = [{&quot;type&quot;: &quot;approve&quot;}]</text>
    <text x="67.6" y="367" fill="#C78EAD">result = agent.invoke(Command(resume={</text>
    <text x="95.2" y="386" fill="#C78EAD">&quot;decisions&quot;: decisions}), config=config, ...)</text>
  </g>
  <line x1="440" y1="173.0" x2="468" y2="159.0" stroke="#6E8900" stroke-width="1.5"/>
  <rect x="468" y="141.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#6E8900" stroke-width="1.5"/>
  <text x="479" y="160.0" font-size="13" fill="#E3FF8F">THE GATE</text>
  <text x="479" y="179.0" font-size="12" fill="#B2DEFF">send_email pauses for review</text>
  <text x="479" y="196.0" font-size="12" fill="#B2DEFF">instead of running right away</text>
  <line x1="440" y1="192.0" x2="468" y2="235.0" stroke="#006DDD" stroke-width="1.5"/>
  <rect x="468" y="217.0" width="368" height="64" rx="6" fill="#0D1322" stroke="#006DDD" stroke-width="1.5"/>
  <text x="479" y="236.0" font-size="13" fill="#7FC8FF">THE SAVE POINT</text>
  <text x="479" y="255.0" font-size="12" fill="#B2DEFF">The checkpointer stores the paused run</text>
  <text x="479" y="272.0" font-size="12" fill="#B2DEFF">under the config&#x27;s thread_id</text>
  <line x1="440" y1="353.5" x2="468" y2="339.5" stroke="#C78EAD" stroke-width="1.5"/>
  <rect x="468" y="321.5" width="368" height="64" rx="6" fill="#0D1322" stroke="#C78EAD" stroke-width="1.5"/>
  <text x="479" y="340.5" font-size="13" fill="#C78EAD">THE RESUME</text>
  <text x="479" y="359.5" font-size="12" fill="#B2DEFF">Your decision goes back in as a resume</text>
  <text x="479" y="376.5" font-size="12" fill="#B2DEFF">Command on the same thread</text>
  <text x="430.0" y="446" text-anchor="middle" font-size="10.5" fill="#CCE9FF">In this lab, each decision is approve, edit, or reject.</text>
</svg>
